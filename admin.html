<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/img/icon-192.png" type="image/png" sizes="192x192"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Panel · Bluzzo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--az:#0038FF;--az2:#002AC4;--ma:#031447;--hi:#EEF2FF;--li:#DCE4FF;--tx2:#5a6a99;--ok:#0E9F6E;--warn:#D97706;--bad:#C0152F;--r:18px}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-behavior:smooth}
body{margin:0;font:15px/1.5 Inter,system-ui,sans-serif;background:var(--hi);color:var(--ma);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.disp{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.01em;line-height:1}
/* botones */
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:999px;border:0;cursor:pointer;font-weight:600;font-size:14px;background:var(--az);color:#fff;transition:transform .2s,box-shadow .2s,background .2s;white-space:nowrap;text-decoration:none}
.b:hover{background:var(--az2);transform:translateY(-1px);box-shadow:0 8px 20px -8px rgba(0,56,255,.6)}.b:active{transform:none}
.b.g{background:#fff;color:var(--az);box-shadow:inset 0 0 0 1.5px var(--li)}.b.g:hover{box-shadow:inset 0 0 0 1.5px var(--az);background:#fff}
.b.s{padding:7px 12px;font-size:13px}.b.ok{background:var(--ok)}.b.bad{background:#fff;color:var(--bad);box-shadow:inset 0 0 0 1.5px #f3c4cb}
.b[disabled]{opacity:.5;pointer-events:none}
input,select{padding:11px 14px;border-radius:12px;border:1.5px solid var(--li);background:#fff;min-width:0}
input:focus,select:focus{outline:2px solid var(--az);outline-offset:1px;border-color:transparent}
/* login */
#login{min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--az);background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:36px 36px}
#login .box{width:100%;max-width:380px;color:#fff}#login img{height:40px;margin-bottom:26px;display:block}
#login h1{font:700 52px/.95 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0 0 18px}
#login .f{background:#fff;border-radius:var(--r);padding:16px;display:flex;gap:10px;box-shadow:0 24px 50px -24px rgba(0,10,80,.7)}#login .f input{flex:1;border:0;background:var(--hi);color:var(--ma)}#login .f input::placeholder{color:#8a97c4}#login .f .b[disabled]{opacity:.7}.eye{background:none;border:0;cursor:pointer;color:var(--tx2);font-weight:600;font-size:13px;padding:0 8px}#le.ok{color:#fff}
#le{min-height:22px;margin:14px 4px 0;color:#fff;font-weight:600;background:rgba(0,10,80,.35);padding:10px 14px;border-radius:12px}#le:empty{background:none;padding:0}
/* layout */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100svh}
.side{background:var(--az);color:#fff;position:sticky;top:0;height:100svh;display:flex;flex-direction:column;padding:22px 16px;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:32px 32px}
.side .logo{height:34px;width:auto;align-self:flex-start;margin:4px 8px 28px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:rgba(255,255,255,.82);padding:12px 14px;border-radius:14px;cursor:pointer;font-weight:600;text-align:left;transition:background .2s,color .2s}
.nav button:hover{background:rgba(255,255,255,.12);color:#fff}.nav button.on{background:#fff;color:var(--az)}
.nav svg{width:20px;height:20px;flex:none}.nav .n{margin-left:auto;font-size:12px;background:rgba(255,255,255,.2);padding:1px 8px;border-radius:99px}.nav .on .n{background:var(--li)}
.side .bot{margin-top:auto;display:flex;flex-direction:column;gap:8px}.side .bot a,.side .bot button{color:#fff;text-decoration:none;font-size:14px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.12);border:0;cursor:pointer;text-align:left;font-weight:500}
.side .bot a:hover,.side .bot button:hover{background:rgba(255,255,255,.22)}
main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1180px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h1{margin:0;font:700 clamp(38px,5vw,58px)/.95 'Barlow Condensed',sans-serif;text-transform:uppercase}.top p{margin:4px 0 0;color:var(--tx2)}
.view{display:none}.view.on{display:block;animation:in .35s cubic-bezier(.2,.7,.2,1)}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.card{background:#fff;border-radius:var(--r);padding:20px;margin-bottom:18px;box-shadow:0 10px 30px -22px rgba(3,20,71,.45)}
.card h2{margin:0 0 14px;font:700 26px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.k{background:#fff;border-radius:var(--r);padding:18px 20px;box-shadow:0 10px 30px -22px rgba(3,20,71,.45)}
.k small{color:var(--tx2);font-weight:600;font-size:13px}.k b{display:block;font:700 44px/1.05 'Barlow Condensed',sans-serif;margin-top:4px}.k span{font-size:13px;color:var(--tx2)}
.k.az{background:var(--az);color:#fff}.k.az small,.k.az span{color:rgba(255,255,255,.8)}
.bar{height:8px;border-radius:99px;background:var(--li);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--az);border-radius:99px;transition:width .8s cubic-bezier(.2,.7,.2,1)}.k.az .bar{background:rgba(255,255,255,.25)}.k.az .bar i{background:#fff}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.empty{padding:26px 10px;text-align:center;color:var(--tx2)}
/* pedidos */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.tools .grow{flex:1 1 220px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:0;cursor:pointer;padding:7px 14px;border-radius:99px;background:var(--hi);color:var(--ma);font-weight:600;font-size:13px}.chip.on{background:var(--az);color:#fff}.chip em{font-style:normal;opacity:.65;margin-left:4px}
.ord{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(190px,1.6fr) auto auto;gap:14px 18px;align-items:center;padding:16px 4px;border-top:1px solid var(--hi)}
.ord:first-child{border-top:0}.ord .ref{font:700 22px/1 'Barlow Condensed',sans-serif;letter-spacing:.02em}.ord .dt{color:var(--tx2);font-size:13px}
.ord .who b{display:block}.ord .who small{color:var(--tx2);display:block;word-break:break-word}.ord .note{font-style:italic;color:var(--tx2);font-size:13px}
.ord .tot{font:700 26px/1 'Barlow Condensed',sans-serif;text-align:right}.ord .tot small{display:block;font:500 12px Inter;color:var(--tx2)}
.ord .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;text-transform:capitalize;background:var(--li);color:var(--az)}
.pill.enviado{background:#FEF3C7;color:#92400E}.pill.entregado{background:#D1FAE5;color:#065F46}.pill.cancelado{background:#FEE2E2;color:#991B1B}
.ord.cancelado{opacity:.55}
.mini{display:inline-flex;gap:4px;align-items:center;margin-top:6px;flex-wrap:wrap}
/* codigos */
.cform{display:grid;grid-template-columns:1.2fr 1.2fr .8fr .8fr auto;gap:10px;margin-bottom:6px}
.code{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 4px;border-top:1px solid var(--hi);flex-wrap:wrap}.code b{font:700 24px/1 'Barlow Condensed',sans-serif;letter-spacing:.04em}.code.off{opacity:.5}
/* contactos */
.seg{display:inline-flex;background:var(--hi);border-radius:99px;padding:4px;gap:2px}.seg button{border:0;background:none;padding:8px 16px;border-radius:99px;font-weight:600;cursor:pointer;color:var(--tx2)}.seg button.on{background:#fff;color:var(--az);box-shadow:0 2px 8px rgba(3,20,71,.12)}
.crow{display:flex;justify-content:space-between;gap:10px;padding:11px 4px;border-top:1px solid var(--hi);align-items:center;flex-wrap:wrap}.crow small{color:var(--tx2)}
/* sorteo */
.sorteo-top{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.win{background:var(--az);color:#fff;border-radius:var(--r);padding:26px;text-align:center;min-height:240px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:30px 30px}
.win small{opacity:.8;font-weight:600}.win .nm{font:700 clamp(40px,6vw,64px)/.95 'Barlow Condensed',sans-serif;text-transform:uppercase;word-break:break-word}
.win.roll .nm{filter:blur(.4px);opacity:.9}.win .act{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}.win .b.g{box-shadow:none}
.part{display:grid;grid-template-columns:minmax(150px,1.4fr) .5fr .5fr .5fr .6fr;gap:10px;align-items:center;padding:12px 4px;border-top:1px solid var(--hi)}
.part.h{border-top:0;color:var(--tx2);font-size:13px;font-weight:600;padding-bottom:6px}.part .c{text-align:center}.part small{color:var(--tx2);display:block}
.part.no{opacity:.55}
.tg{width:44px;height:26px;border-radius:99px;background:var(--li);border:0;position:relative;cursor:pointer;transition:background .2s;padding:0}.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.25)}.tg.on{background:var(--ok)}.tg.on::after{transform:translateX(18px)}
.hint{background:var(--hi);border-radius:14px;padding:12px 14px;color:var(--tx2);font-size:14px}
/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:var(--ma);color:#fff;padding:12px 20px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:50}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.grid2,.sorteo-top{grid-template-columns:1fr}.cform{grid-template-columns:1fr 1fr}.ord{grid-template-columns:1fr 1fr}.ord .act{justify-content:flex-start}.ord .tot{text-align:left}}
@media(max-width:820px){
 #app{grid-template-columns:1fr}
 .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:40;background-image:none;box-shadow:0 -10px 30px -12px rgba(0,10,80,.5);justify-content:center}
 .side .logo,.side .bot{display:none}.nav{flex-direction:row;width:100%;justify-content:space-around;gap:0}
 .nav button{flex-direction:column;gap:2px;padding:8px 6px;font-size:11px;flex:1;align-items:center;text-align:center;border-radius:12px}.nav .n{display:none}
 main{padding-bottom:100px}.mtop{display:flex!important}
 .part{grid-template-columns:1fr 1fr 1fr;}.part .who{grid-column:1/-1}.part.h{display:none}
 .part .c::before{content:attr(data-l);display:block;font-size:11px;color:var(--tx2);font-weight:600}
}
.mtop{display:none;align-items:center;justify-content:space-between;background:var(--az);margin:-28px -16px 20px;padding:14px 16px}.mtop img{height:28px}.mtop button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:99px;padding:7px 14px;font-weight:600}
@media print{.side,.tools,.chips,.mtop{display:none}}
</style></head><body>

<div id="login"><div class="box"><img src="/img/logo.png" alt="Bluzzo"><h1>Panel<br>de control.</h1>
<div class="f"><input id="pw" type="password" placeholder="Tu clave" autocomplete="current-password" autofocus><button class="eye" id="eye" type="button">Ver</button><button class="b" id="go">Entrar</button></div><p id="le" role="alert"></p></div></div>

<div id="app" hidden>
<aside class="side"><img class="logo" src="/img/logo.png" alt="Bluzzo">
 <nav class="nav" id="nav">
  <button data-v="resumen" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Resumen</button>
  <button data-v="pedidos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>Pedidos<span class="n" id="nP"></span></button>
  <button data-v="sorteo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>Sorteo</button>
  <button data-v="codigos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.5"/></svg>Códigos</button>
  <button data-v="contactos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>Contactos<span class="n" id="nC"></span></button>
 </nav>
 <div class="bot"><a href="/" target="_blank" rel="noopener">Ver el sitio ↗</a><button id="out">Cerrar sesión</button></div>
</aside>
<main>
 <div class="mtop"><img src="/img/logo.png" alt="Bluzzo"><button id="out2">Salir</button></div>
 <div class="top"><div><h1 id="vt">Resumen</h1><p id="vs"></p></div><button class="b g" id="ref">↻ Actualizar</button></div>
 <section class="view on" id="v-resumen"></section>
 <section class="view" id="v-pedidos"></section>
 <section class="view" id="v-sorteo"></section>
 <section class="view" id="v-codigos"></section>
 <section class="view" id="v-contactos"></section>
</main></div>
<div id="toast"></div>

<script>
var K=sessionStorage.getItem('bk')||'',D=null,V='resumen',PF={q:'',e:'todos'},CT='subs',SM='',WIN=null,PREMIO='1 notebook Bluzzo';
var $=function(s,r){return(r||document).querySelector(s)};
function api(m,b){return fetch('/api/admin',{method:m,headers:{'x-admin-key':K,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).catch(function(){throw new Error('red')}).then(function(r){if(r.status===401)throw new Error('clave');if(r.status===501)throw new Error('config');if(!r.ok)throw new Error('x');return r.json()})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function f(d){return new Date(d).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'})}
function money(n){return 'S/ '+Number(n).toFixed(2)}
function wa(n,t){n=String(n).replace(/\D/g,'');return 'https://wa.me/'+(n.length<=9?'51':'')+n+(t?'?text='+encodeURIComponent(t):'')}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},2200)}
function copy(t,msg){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast(msg||'Copiado')}).catch(function(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(msg||'Copiado')}catch(e){toast('No se pudo copiar')}a.remove()})}
function csv(name,rows){var s='﻿'+rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function mesDe(d){var x=new Date(new Date(d).toLocaleString('en-US',{timeZone:'America/Lima'}));return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')}
function mesTxt(m){var p=m.split('-');return new Date(p[0],p[1]-1,1).toLocaleDateString('es-PE',{month:'long',year:'numeric'})}
function nextState(e){return{pagado:'enviado',enviado:'entregado'}[e]}
var NS={pagado:'Marcar enviado',enviado:'Marcar entregado'};

/* ---------- vistas ---------- */
var TITLES={resumen:['Resumen','Cómo va tu primer drop.'],pedidos:['Pedidos','Gestiona, contacta y envía.'],sorteo:['Sorteo mensual','Elige al ganador del mes.'],codigos:['Códigos','Descuentos para tus clientes.'],contactos:['Contactos','Suscriptores y lista de espera.']};
function go(v){V=v;document.querySelectorAll('.view').forEach(function(x){x.classList.toggle('on',x.id==='v-'+v)});document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});$('#vt').textContent=TITLES[v][0];$('#vs').textContent=TITLES[v][1];render();window.scrollTo(0,0)}
function vivos(){return D.pedidos.filter(function(p){return p.estado!=='cancelado'})}
function render(){if(!D)return;$('#nP').textContent=D.pedidos.filter(function(p){return p.estado==='pagado'}).length||'';$('#nC').textContent=(D.suscriptores.length+D.espera.length)||'';({resumen:rResumen,pedidos:rPedidos,sorteo:rSorteo,codigos:rCodigos,contactos:rContactos})[V]()}

function ordRow(p){var nx=NS[p.estado];
 return '<div class="ord '+p.estado+'"><div><div class="ref">'+esc(p.ref)+'</div><div class="dt">'+f(p.created_at)+'</div><div class="mini"><span class="pill '+p.estado+'">'+p.estado+'</span></div></div>'+
 '<div class="who"><b>'+esc(p.nombre)+'</b><small>'+esc(p.celular)+' · '+esc(p.email)+'</small><small>'+esc(p.zona)+' — '+esc(p.direccion)+(p.ciudad?', '+esc(p.ciudad):'')+'</small>'+(p.notas?'<span class="note">“'+esc(p.notas)+'”</span>':'')+'</div>'+
 '<div class="tot">'+money(p.total)+'<small>'+p.cantidad+' notebook'+(p.cantidad>1?'s':'')+(p.codigo?' · '+esc(p.codigo):'')+'</small></div>'+
 '<div class="act">'+(nx?'<button class="b s ok" data-adv="'+p.id+'" data-to="'+nextState(p.estado)+'">'+nx+'</button>':'')+
 '<a class="b s g" target="_blank" rel="noopener" href="'+wa(p.celular,'Hola '+p.nombre+', te escribo por tu pedido Bluzzo '+p.ref+'.')+'">WhatsApp</a>'+
 '<button class="b s g" data-cp="'+esc(p.nombre+'\n'+p.celular+'\n'+p.direccion+(p.ciudad?', '+p.ciudad:'')+'\n'+p.zona)+'">Copiar envío</button>'+
 (p.estado!=='cancelado'?'<button class="b s bad" data-cancel="'+p.id+'" data-r="'+esc(p.ref)+'">Cancelar</button>':'<button class="b s g" data-adv="'+p.id+'" data-to="pagado">Reactivar</button>')+'</div></div>'}

function rResumen(){var r=D.resumen,pct=Math.min(100,Math.round(r.libros/r.cupos*100)),porEnv=D.pedidos.filter(function(p){return p.estado==='pagado'}).length;
 var hoy=D.pedidos.filter(function(p){return p.estado!=='cancelado'&&new Date(p.created_at).toDateString()===new Date().toDateString()}).length;
 var pend=D.pedidos.filter(function(p){return p.estado==='pagado'}).slice(0,5);
 $('#v-resumen').innerHTML='<div class="kpis"><div class="k az"><small>Cupos vendidos</small><b>'+r.libros+' / '+r.cupos+'</b><div class="bar"><i style="width:'+pct+'%"></i></div><span>'+pct+'% del primer drop</span></div>'+
 '<div class="k"><small>Cobrado</small><b>'+money(r.total)+'</b><span>'+r.pedidos+' pedido'+(r.pedidos==1?'':'s')+'</span></div>'+
 '<div class="k"><small>Por enviar</small><b>'+porEnv+'</b><span>pedidos pagados sin enviar</span></div>'+
 '<div class="k"><small>Hoy</small><b>'+hoy+'</b><span>pedidos nuevos</span></div></div>'+
 '<div class="grid2"><div class="card"><h2>Por enviar <button class="b s g" data-go="pedidos">Ver todos</button></h2>'+(pend.map(ordRow).join('')||'<div class="empty">Nada pendiente. ¡Todo al día! 🎉</div>')+'</div>'+
 '<div><div class="card"><h2>Tu comunidad</h2><div class="crow"><span>Suscriptores</span><b>'+D.suscriptores.length+'</b></div><div class="crow"><span>Lista de espera</span><b>'+D.espera.length+'</b></div><div class="crow"><span>Códigos activos</span><b>'+D.codigos.filter(function(c){return c.activo}).length+'</b></div></div>'+
 '<div class="card"><h2>Atajos</h2><div style="display:flex;flex-direction:column;gap:8px"><button class="b" data-go="sorteo">🎁 Hacer el sorteo del mes</button><button class="b g" id="qm">Copiar todos los correos</button><button class="b g" id="qe">Exportar pedidos (CSV)</button></div></div></div></div>'}

function filtrados(){var q=PF.q.toLowerCase();return D.pedidos.filter(function(p){return(PF.e==='todos'||p.estado===PF.e)&&(!q||[p.ref,p.nombre,p.celular,p.email,p.direccion].join(' ').toLowerCase().indexOf(q)>-1)})}
function rPedidos(){var c={todos:D.pedidos.length};['pagado','enviado','entregado','cancelado'].forEach(function(e){c[e]=D.pedidos.filter(function(p){return p.estado===e}).length});
 var l=filtrados();
 $('#v-pedidos').innerHTML='<div class="card"><div class="tools"><input class="grow" id="pq" placeholder="Buscar por nombre, referencia, celular o correo" value="'+esc(PF.q)+'"><button class="b g" id="qe">Exportar CSV</button></div>'+
 '<div class="chips">'+['todos','pagado','enviado','entregado','cancelado'].map(function(e){return '<button class="chip'+(PF.e===e?' on':'')+'" data-e="'+e+'">'+(e==='todos'?'Todos':e[0].toUpperCase()+e.slice(1))+'<em>'+c[e]+'</em></button>'}).join('')+'</div>'+
 '<div id="plist">'+(l.map(ordRow).join('')||'<div class="empty">'+(D.pedidos.length?'No hay pedidos con ese filtro.':'Aún no hay pedidos. Cuando alguien pague, aparecerá aquí.')+'</div>')+'</div></div>';
 var i=$('#pq');i.oninput=function(){PF.q=i.value;var pos=i.selectionStart;$('#plist').innerHTML=(filtrados().map(ordRow).join('')||'<div class="empty">No hay pedidos con ese filtro.</div>')}}

function rCodigos(){$('#v-codigos').innerHTML='<div class="card"><h2>Crear código</h2><div class="cform"><input id="cc" placeholder="CÓDIGO (ej. BLU10)"><select id="ct"><option value="porcentaje">% de descuento</option><option value="monto">S/ de descuento</option></select><input id="cv" type="number" min="1" placeholder="Valor"><input id="cm" type="number" min="1" placeholder="Usos máx."><button class="b" id="cadd">Crear</button></div><small style="color:var(--tx2)">Déjalo vacío en «Usos máx.» para uso ilimitado.</small></div>'+
 '<div class="card"><h2>Tus códigos</h2>'+(D.codigos.map(function(c){return '<div class="code'+(c.activo?'':' off')+'"><div><b>'+esc(c.codigo)+'</b><br><small style="color:var(--tx2)">'+(c.tipo==='porcentaje'?c.valor+'% de descuento':money(c.valor)+' de descuento')+' · '+c.usos+(c.max_usos?' / '+c.max_usos:'')+' usos</small></div><div style="display:flex;gap:8px"><button class="b s g" data-cp="'+esc(c.codigo)+'">Copiar</button><button class="b s '+(c.activo?'bad':'ok')+'" data-c="'+esc(c.codigo)+'" data-a="'+(c.activo?0:1)+'">'+(c.activo?'Desactivar':'Activar')+'</button></div></div>'}).join('')||'<div class="empty">Aún no hay códigos.</div>')+'</div>'}

function rContactos(){var L=CT==='subs'?D.suscriptores:D.espera;
 $('#v-contactos').innerHTML='<div class="card"><div class="tools"><div class="seg"><button data-ct="subs" class="'+(CT==='subs'?'on':'')+'">Suscriptores ('+D.suscriptores.length+')</button><button data-ct="esp" class="'+(CT==='esp'?'on':'')+'">Lista de espera ('+D.espera.length+')</button></div><span class="grow"></span><button class="b g" id="cm2">Copiar correos</button><button class="b g" id="cx">Exportar CSV</button></div>'+
 (L.map(function(e){var c=CT==='subs'?e.correo:e.contacto,w=CT==='esp'&&e.tipo==='whatsapp';return '<div class="crow"><div><b>'+esc(c)+'</b><br><small>'+f(e.created_at)+(CT==='subs'?(e.origen?' · desde '+esc(e.origen):''):' · '+e.tipo)+'</small></div><div style="display:flex;gap:8px">'+(w?'<a class="b s g" target="_blank" rel="noopener" href="'+wa(c)+'">WhatsApp</a>':'')+'<button class="b s g" data-cp="'+esc(c)+'">Copiar</button></div></div>'}).join('')||'<div class="empty">Aún no hay '+(CT==='subs'?'suscriptores':'nadie en espera')+'.</div>')+'</div>'}

/* ---------- sorteo ---------- */
function participantes(mes){var m={};D.pedidos.forEach(function(p){if(p.estado==='cancelado'||mesDe(p.created_at)!==mes)return;var k=(p.email||p.celular).toLowerCase();var x=m[k]||(m[k]={correo:k,nombre:p.nombre,celular:p.celular,ref:p.ref,n:0});x.n+=p.cantidad});
 var est={};D.sorteo_estado.filter(function(e){return e.mes===mes}).forEach(function(e){est[e.correo]=e});
 return Object.keys(m).map(function(k){var x=m[k],e=est[k]||{};x.sigue=!!e.sigue;x.historia=!!e.historia;x.ok=x.sigue&&x.historia;return x}).sort(function(a,b){return b.n-a.n})}
function meses(){var s={};D.pedidos.forEach(function(p){s[mesDe(p.created_at)]=1});s[mesDe(new Date())]=1;return Object.keys(s).sort().reverse()}
function rSorteo(){var ms=meses();if(!SM||ms.indexOf(SM)<0)SM=ms[0];var P=participantes(SM),el=P.filter(function(x){return x.ok}),T=el.reduce(function(a,x){return a+x.n},0);
 var hist=D.sorteos.map(function(s){return '<div class="crow"><div><b>'+esc(s.nombre)+'</b> <span class="pill">'+esc(mesTxt(s.mes))+'</span><br><small>'+esc(s.premio||'')+' · '+f(s.created_at)+' · '+esc(s.ref||'')+'</small></div>'+(s.celular?'<a class="b s g" target="_blank" rel="noopener" href="'+wa(s.celular,'¡Hola '+s.nombre+'! Ganaste el sorteo de Bluzzo 🎉')+'">WhatsApp</a>':'')+'</div>'}).join('')||'<div class="empty">Aún no hay ganadores guardados.</div>';
 $('#v-sorteo').innerHTML='<div class="sorteo-top"><div class="card" style="margin:0"><h2>Configura</h2><div style="display:grid;gap:10px"><label>Mes<select id="sm" style="width:100%">'+ms.map(function(m){return '<option value="'+m+'"'+(m===SM?' selected':'')+'>'+esc(mesTxt(m))+'</option>'}).join('')+'</select></label><label>Premio<input id="sp" style="width:100%" value="'+esc(PREMIO)+'"></label><div class="hint"><b>'+el.length+'</b> de '+P.length+' compradores cumplen los requisitos · <b>'+T+'</b> entradas (cada notebook comprado es una).</div></div></div>'+
 '<div class="win" id="win">'+winHtml(T)+'</div></div><br>'+
 '<div class="card"><h2>Participantes de '+esc(mesTxt(SM))+'</h2><div class="hint" style="margin-bottom:10px">Revisa en Instagram quién te sigue y quién subió historia, y activa los dos interruptores. Solo entran al sorteo quienes cumplen ambos.</div>'+
 '<div class="part h"><span>Comprador</span><span class="c">Entradas</span><span class="c">Sigue la cuenta</span><span class="c">Subió historia</span><span class="c">Probabilidad</span></div>'+
 (P.map(function(x){return '<div class="part'+(x.ok?'':' no')+'"><div class="who"><b>'+esc(x.nombre)+'</b><small>'+esc(x.correo)+'</small></div><div class="c" data-l="Entradas"><b>'+x.n+'</b></div><div class="c" data-l="Sigue"><button class="tg'+(x.sigue?' on':'')+'" data-t="sigue" data-k="'+esc(x.correo)+'" aria-label="Sigue la cuenta"></button></div><div class="c" data-l="Historia"><button class="tg'+(x.historia?' on':'')+'" data-t="historia" data-k="'+esc(x.correo)+'" aria-label="Subió historia"></button></div><div class="c" data-l="Probabilidad">'+(x.ok&&T?Math.round(x.n/T*1000)/10+'%':'—')+'</div></div>'}).join('')||'<div class="empty">Nadie compró en '+esc(mesTxt(SM))+' todavía.</div>')+'</div>'+
 '<div class="card"><h2>Ganadores anteriores</h2>'+hist+'</div>'}
function winHtml(T){if(WIN&&WIN.fin)return '<small>🎉 ¡Ganador de '+esc(mesTxt(WIN.mes))+'!</small><div class="nm">'+esc(WIN.p.nombre)+'</div><small>'+WIN.p.n+' entrada'+(WIN.p.n>1?'s':'')+' · '+esc(WIN.p.ref)+'</small><div class="act"><a class="b g" target="_blank" rel="noopener" href="'+wa(WIN.p.celular,'¡Hola '+WIN.p.nombre+'! Ganaste el sorteo mensual de Bluzzo 🎉 Premio: '+PREMIO+'. ¿Me confirmas tu dirección de envío?')+'">Avisar por WhatsApp</a><button class="b g" id="wsave"'+(WIN.saved?' disabled':'')+'>'+(WIN.saved?'Guardado ✓':'Guardar ganador')+'</button><button class="b g" id="wagain">Sortear de nuevo</button></div>';
 if(WIN&&!WIN.fin)return '<small>Sorteando…</small><div class="nm" id="rn">'+esc(WIN.show||'')+'</div>';
 return '<small>Listo para sortear</small><div class="nm">'+(T?'🎁':'Sin participantes')+'</div><div class="act"><button class="b g" id="wgo"'+(T?'':' disabled')+'>Sortear ahora</button></div>'}
function rnd(n){var a=new Uint32Array(1),max=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=max);return a[0]%n}
function sortear(){var el=participantes(SM).filter(function(x){return x.ok});if(!el.length)return;var pool=[];el.forEach(function(x){for(var i=0;i<x.n;i++)pool.push(x)});var w=pool[rnd(pool.length)];
 WIN={fin:false,mes:SM,p:w,show:''};$('#win').className='win roll';var n=0,t=setInterval(function(){n++;WIN.show=el[rnd(el.length)].nombre;var r=$('#rn');if(r)r.textContent=WIN.show;if(n>26){clearInterval(t);WIN.fin=true;$('#win').className='win';$('#win').innerHTML=winHtml();confetti()}},90);$('#win').innerHTML=winHtml()}
function confetti(){var c=['#fff','#9DB4FF','#FFD84D'];for(var i=0;i<46;i++){var e=document.createElement('i');e.style.cssText='position:fixed;top:-10px;left:'+Math.random()*100+'vw;width:8px;height:14px;background:'+c[i%3]+';z-index:60;border-radius:2px;pointer-events:none;transition:transform '+(1.6+Math.random()*1.4)+'s cubic-bezier(.2,.6,.4,1),opacity 2.6s;';document.body.appendChild(e);(function(e){setTimeout(function(){e.style.transform='translate('+(Math.random()*160-80)+'px,'+(innerHeight+40)+'px) rotate('+Math.random()*720+'deg)';e.style.opacity=0},30);setTimeout(function(){e.remove()},3200)})(e)}}

/* ---------- datos / eventos ---------- */
function load(){return api('GET').then(function(d){D=d;$('#login').hidden=true;$('#app').hidden=false;render()}).catch(function(e){$('#login').hidden=false;$('#app').hidden=true;sessionStorage.removeItem('bk');
 var M={clave:'Clave incorrecta. Revisa mayúsculas y que no tenga espacios.',config:'El panel aún no está configurado en el servidor.',red:'No hay conexión con el servidor. Revisa tu internet e inténtalo de nuevo.'};
 $('#le').textContent=M[e.message]||'Algo falló al cargar el panel. Inténtalo otra vez.';throw e})}
function act(b,msg){return api('POST',b).then(function(){return load()}).then(function(){if(msg)toast(msg)}).catch(function(){toast('No se pudo guardar')})}
$('#go').onclick=function(){var b=$('#go');K=$('#pw').value.trim();if(!K){$('#le').textContent='Escribe tu clave.';return}sessionStorage.setItem('bk',K);$('#le').textContent='';b.disabled=true;b.textContent='Entrando…';load().catch(function(){}).then(function(){b.disabled=false;b.textContent='Entrar'})};
$('#pw').onkeydown=function(e){if(e.key==='Enter')$('#go').click()};
$('#eye').onclick=function(){var p=$('#pw'),v=p.type==='password';p.type=v?'text':'password';this.textContent=v?'Ocultar':'Ver'};
function salir(){sessionStorage.removeItem('bk');location.reload()}$('#out').onclick=salir;$('#out2').onclick=salir;
$('#ref').onclick=function(){load().then(function(){toast('Actualizado')}).catch(function(){})};
$('#nav').onclick=function(e){var b=e.target.closest('button');if(b)go(b.dataset.v)};
document.addEventListener('click',function(e){var t=e.target.closest('button,a');if(!t)return;var d=t.dataset;
 if(d.go)return go(d.go);
 if(d.cp!=null)return copy(d.cp);
 if(d.adv)return act({accion:'estado',id:d.adv,estado:d.to},'Pedido actualizado');
 if(d.cancel){if(confirm('¿Cancelar el pedido '+d.r+'? Dejará de contar como cupo vendido. (No devuelve el dinero: eso se hace en Culqi.)'))act({accion:'estado',id:d.cancel,estado:'cancelado'},'Pedido cancelado');return}
 if(d.e){PF.e=d.e;return rPedidos()}
 if(d.ct){CT=d.ct;return rContactos()}
 if(d.c)return act({accion:'codigo_activo',codigo:d.c,activo:d.a==='1'},d.a==='1'?'Código activado':'Código desactivado');
 if(d.t){var k=d.k,x=participantes(SM).filter(function(p){return p.correo===k})[0],s=x.sigue,h=x.historia;if(d.t==='sigue')s=!s;else h=!h;
  var ex=D.sorteo_estado.filter(function(e){return e.mes===SM&&e.correo===k})[0];if(ex){ex.sigue=s;ex.historia=h}else D.sorteo_estado.push({mes:SM,correo:k,sigue:s,historia:h});WIN=null;rSorteo();
  return api('POST',{accion:'sorteo_check',mes:SM,correo:k,sigue:s,historia:h}).catch(function(){toast('No se pudo guardar')})}
 if(t.id==='cadd')return act({accion:'codigo',codigo:$('#cc').value,tipo:$('#ct').value,valor:$('#cv').value,max_usos:$('#cm').value},'Código creado');
 if(t.id==='qe')return csv('pedidos-bluzzo.csv',[['Fecha','Ref','Estado','Nombre','Celular','Correo','Zona','Dirección','Ciudad','Notas','Cantidad','Código','Total']].concat((V==='pedidos'?filtrados():D.pedidos).map(function(p){return[f(p.created_at),p.ref,p.estado,p.nombre,p.celular,p.email,p.zona,p.direccion,p.ciudad,p.notas,p.cantidad,p.codigo,p.total]})));
 if(t.id==='qm'){var s={};D.suscriptores.forEach(function(x){s[x.correo]=1});D.pedidos.forEach(function(p){if(p.email)s[p.email.toLowerCase()]=1});D.espera.forEach(function(x){if(x.tipo==='correo')s[x.contacto]=1});return copy(Object.keys(s).join(', '),Object.keys(s).length+' correos copiados')}
 if(t.id==='cm2'){var m=(CT==='subs'?D.suscriptores.map(function(x){return x.correo}):D.espera.filter(function(x){return x.tipo==='correo'}).map(function(x){return x.contacto}));return copy(m.join(', '),m.length+' correos copiados')}
 if(t.id==='cx')return csv(CT==='subs'?'suscriptores-bluzzo.csv':'lista-espera-bluzzo.csv',[['Fecha',CT==='subs'?'Correo':'Contacto',CT==='subs'?'Desde':'Tipo']].concat((CT==='subs'?D.suscriptores:D.espera).map(function(x){return[f(x.created_at),x.correo||x.contacto,x.origen||x.tipo||'']})));
 if(t.id==='wgo'||t.id==='wagain'){WIN=null;return sortear()}
 if(t.id==='wsave'&&WIN&&WIN.fin&&!WIN.saved){WIN.saved=true;return act({accion:'sorteo_ganador',mes:WIN.mes,nombre:WIN.p.nombre,correo:WIN.p.correo,celular:WIN.p.celular,ref:WIN.p.ref,premio:PREMIO,entradas:WIN.p.n},'Ganador guardado').then(function(){go('sorteo')})}
});
document.addEventListener('change',function(e){if(e.target.id==='sm'){SM=e.target.value;WIN=null;rSorteo()}});
document.addEventListener('input',function(e){if(e.target.id==='sp')PREMIO=e.target.value});
if(K)load().catch(function(){});
